[project]
name = "elder-care-demo"
version = "0.1.0"
description = "Elder Care Monitoring Demo - Stop Using LLMs for Everything"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "uvicorn[standard]>=0.40.0",
    "sse-starlette>=2.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require LlamaFarm services running",
]
asyncio_mode = "auto"
